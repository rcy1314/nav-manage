version: "3.8"

services:
  yaml-server:
    build: .
    container_name: noisedh-yaml-server
    ports:
      - "8990:8990"
    environment:
      - PORT=8990
      - ENABLE_HUGO=false
      - BASE_DIR=/app/hugo
      - SEARCH_DATA_DIRS=${SEARCH_DATA_DIRS:-/app/hugo/data,/www/wwwroot/www.noisedh.cn/data}
      - API_TOKEN=change_me
      - MCP_TOKEN=change_me_mcp
      - MCP_REQUIRE_TOKEN=false
      - MCP_RATE_LIMIT_MAX=120
      - MCP_RATE_LIMIT_WINDOW_MS=60000
      - MCP_SCAN_INTERVAL_MS=60000
      - REMOTE_UPDATE_WEBHOOK=
      - WEBHOOK_URL=
      - TELEGRAM_CHAT_ID=
      - TELEGRAM_BOT_TOKEN=
      - MCP_HTTP=true
    volumes:
      - /path/to/your/hugo-or-data-root:/app/hugo
      - ./notifications.json:/app/server/notifications.json
      - ./trigger_hugo.sh:/app/server/trigger_hugo.sh
    restart: always
