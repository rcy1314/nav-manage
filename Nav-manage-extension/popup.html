<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <script src="theme.js"></script>
  <title>Nav-manag导航书签管理</title>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button id="themeToggle" class="icon-btn" title="切换主题" aria-label="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2m0 16v2m10-10h-2M4 12H2m15.07-7.07l-1.41 1.41M5.34 18.66l-1.41 1.41m14.14 0l-1.41-1.41M5.34 5.34l-1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="header-center">
        <h1 class="header-title">Nav Manage</h1>
      </div>
      <div class="header-actions">
        <a id="githubLink" class="icon-btn" href="https://github.com/rcy1314/nav-manage" target="_blank" title="GitHub仓库" aria-label="GitHub">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
          </svg>
        </a>
        <button id="invalidCheckBtn" class="icon-btn" type="button" title="失效检测" aria-label="失效检测">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10 7h-1a5 5 0 0 0 0 10h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 17h1a5 5 0 0 0 0-10h-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <a class="icon-btn" href="options.html" target="_blank" title="打开设置" aria-label="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.1 7.1 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.04.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96c.22.09.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
          </svg>
        </a>
        <button id="pinBtn" class="icon-btn" type="button" title="置顶悬浮窗口" aria-label="置顶">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 17v5m-4-5h8l1-5-2-2V4a1 1 0 0 0-1-1H10a1 1 0 0 0-1 1v6l-2 2 1 5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="closeBtn" class="icon-btn" type="button" title="关闭" aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="tabs">
      <button id="tabAdd" class="tab active" type="button" title="收录">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="tabSearch" class="tab" type="button" title="搜索">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button id="tabAi" class="tab" type="button" title="AI 分析">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </button>
    </div>

    <div class="content">
      <div id="panelAdd" class="form-container">
        
        <div class="field-gap">
          <div class="field-head">
            <label id="titleLabel" for="title" class="styled-label"><span class="label-icon">T</span><span id="titleLabelText">标题</span></label>
            <div id="aiStatus" class="ai-status-inline">AI 分析未启用</div>
          </div>
          <input id="title" type="text" placeholder="自动读取当前网页标题">
        </div>

        <div id="headersExtra" class="field-gap hidden">
          <label for="headersEntryType" class="styled-label"><span class="label-icon">▦</span>写入类型</label>
          <select id="headersEntryType">
            <option value="top">一级菜单（item/icon/link）</option>
            <option value="sub">更多(list) 子项（name/url）</option>
          </select>

          <div id="headersParentGroup" class="field-gap hidden" style="margin-top: 16px;">
            <label for="headersParent" class="styled-label"><span class="label-icon">↳</span>父级菜单（item）</label>
            <input id="headersParent" type="text" placeholder="例如：更多">
          </div>
        </div>

        <div class="field-gap" id="descriptionGroup">
          <label id="descriptionLabel" for="description" class="styled-label"><span class="label-icon">≡</span><span id="descriptionLabelText">摘要</span></label>
          <textarea id="description" placeholder="自动提取 description（可编辑）"></textarea>
        </div>

        <div id="aiRecommendation" class="ai-recommend-card hidden">
          <div style="font-weight:800">✨ AI 推荐：<span id="aiRecText">正在分析...</span></div>
          <div class="ai-actions">
            <button id="rerunAi" class="apply-btn secondary" type="button">重新分析</button>
            <button id="applyAiRec" class="apply-btn" type="button">应用</button>
          </div>
        </div>

        <div class="field-gap" id="taxonomyCard">
          <label for="taxonomy" class="styled-label"><span class="label-icon">▦</span>分类</label>
          <select id="taxonomy"></select>
          
          <label for="term" id="termLabel" class="styled-label" style="margin-top: 16px;"><span class="label-icon">↳</span>子分类</label>
          <select id="term" disabled></select>
          
          <div class="category-actions">
            <button id="addTaxonomyBtn" class="mini-link" type="button">新增分类</button>
            <button id="addTermBtn" class="mini-link" type="button">新增子分类</button>
          </div>
        </div>

        <div class="field-gap" id="urlGroup" style="margin-top: 20px;">
          <label id="urlLabel" for="url" class="styled-label"><span class="label-icon">🔗</span><span id="urlLabelText">地址</span></label>
          <input id="url" type="text" placeholder="自动读取当前网页 URL">
        </div>

        <div class="field-gap" id="logoGroup">
          <label id="logoLabel" for="logo" class="styled-label"><span class="label-icon">🖼</span><span id="logoLabelText">Logo</span></label>
          <input id="logo" type="text" placeholder="自动提取 favicon（可编辑）">
        </div>

        <div class="field-gap" style="margin-top: 24px; margin-bottom: 24px;">
          <button id="send" class="btn-primary" type="button">收录</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div id="panelSearch" class="hidden">
        <div class="field-gap">
          <div class="styled-label"><span class="label-icon">🔎</span>搜索</div>
          <div class="row" style="margin-top:8px;">
            <input id="searchInput" type="text" placeholder="输入关键词（标题/描述/链接）">
            <button id="executeSearch" class="mini-btn" type="button">搜索</button>
          </div>
          <div class="status" id="searchHint">支持在当前文件内搜索并可一键删除</div>
        </div>
        <div id="searchResults" class="results" style="margin-top:16px;"></div>
      </div>
    </div>

    <footer class="file-footer" aria-label="文件选择">
      <div class="file-footer-inner">
        <div class="file-select">
          <select id="dataSource" aria-label="数据库文件"></select>
        </div>
        <div class="file-current" title="当前文件">
          <svg class="file-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6A2.5 2.5 0 0 1 20.5 9.5v7A2.5 2.5 0 0 1 18 19H6A2.5 2.5 0 0 1 3.5 16.5v-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <div id="filePathText" class="file-name"></div>
        </div>
      </div>
    </footer>
  </div>

  <script src="libs/js-yaml.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
